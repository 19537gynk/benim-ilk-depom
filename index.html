
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f8;
    margin: 0;
    padding: 40px 15px;
}
.container {
    max-width: 600px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 20px #0001;
}
h1 { color: #17365d; }
p { color: #555; }
input {
    width: 90%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}
button {
    background: #17365d;
    color: white;
    padding: 13px 25px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
#result {
    margin-top: 25px;
    text-align: left;
}
.valid { color: green; }
.invalid { color: red; }
</style>
</head>

<body>

<div class="container">
    <h1>Certificate Verification</h1>
    <p>Enter your certificate reference number below.</p>

    <input id="certificateCode"
           placeholder="Enter Certificate Number">

    <br>
    <button onclick="verifyCertificate()">
        Verify Certificate
    </button>

    <div id="result"></div>
</div>

<script>
const certificates = {
    "DEMO12345": {
        name: "John Example",
        course: "Islamic Studies",
        date: "05 November 2026",
        status: "Valid"
    }
};

function verifyCertificate() {
    const code = document.getElementById(
        "certificateCode"
    ).value.trim().toUpperCase();

    const result = document.getElementById("result");

    if (certificates[code]) {
        const cert = certificates[code];

        result.innerHTML = `
            <h2 class="valid">✓ Certificate Verified</h2>
            <p><b>Name:</b> ${cert.name}</p>
            <p><b>Course:</b> ${cert.course}</p>
            <p><b>Issue Date:</b> ${cert.date}</p>
            <p><b>Status:</b> ${cert.status}</p>
        `;
    } else {
        result.innerHTML =
            '<h2 class="invalid">Certificate Not Found</h2>';
    }
}
</script>

</body>
</html>
